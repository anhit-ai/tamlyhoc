h Tâm – Sinh – Xã", "head": ["Tiêu chí so sánh", "Mô hình Y Sinh học (Biomedical)", "Mô hình Tâm – Sinh – Xã (Biopsychosocial)"], "rows": [["Cái nhìn về bệnh tật", "Bệnh thuần túy do rối loạn sinh lý, nhiễm trùng, di truyền", "Bệnh là kết quả tương tác phức tạp giữa sinh học, tâm lý và xã hội"], ["Cách tiếp cận", "Giảm triệu chứng bằng thuốc men hoặc phẫu thuật", "Hiểu toàn diện con người trong toàn cảnh bối cảnh sống"], ["Vai trò thân chủ", "Thụ động tiếp nhận điều trị từ bác sĩ", "Chủ động hợp tác cùng nhà chuyên môn và hệ thống hỗ trợ"], ["Ví dụ trầm cảm", "Chỉ coi là do mất cân bằng nồng độ serotonin trong não", "Tương tác: gen/mất ngủ (Bio) + tự chỉ trích (Psycho) + mất việc (Social)"]]}], "tips": ["PFC = 'Tổng thống' ra quyết định và kiểm soát; Amygdala = 'Còi báo động' đe dọa; Hippocampus = 'Thư viện ký ức'.", "Mô hình Ba não MacLean: Chỉ là ẩn dụ dạy học, không phải bản đồ giải phẫu hiện đại!", "Giản lược sinh học (Reductionism): Nói 'trầm cảm chỉ là do thiếu serotonin' giống như nói 'bức tranh nàng Mona Lisa chỉ là vài gram phẩm màu trên vải'!", "Cảm xúc và lý trí không tách rời; chúng là mạng lưới phối hợp nhịp nhàng giữa PFC và hệ viền."], "cards": [["Neuron", "Đơn vị cấu tạo cơ bản của hệ thần kinh, có tính hưng phấn và dẫn truyền xung điện/hóa học."], ["Soma (Thân tế bào)", "Trung tâm điều khiển, xử lý thông tin và duy trì sự sống của tế bào thần kinh."], ["Dendrite (Sợi nhánh)", "Nhánh tiếp nhận thông tin từ các neuron khác truyền về thân tế bào."], ["Axon (Sợi trục)", "Phần kéo dài truyền tín hiệu điện từ thân tế bào đi đến neuron hoặc cơ quan đáp ứng."], ["Synapse", "Khớp nối tiếp xúc giữa hai neuron, nơi tín hiệu hóa học được truyền qua chất dẫn truyền thần kinh."], ["Vỏ não trước trán (PFC)", "Vùng não phụ trách các chức năng điều hành: lập kế hoạch, kiểm soát xung động, ra quyết định."], ["Hạch hạnh nhân (Amygdala)", "Cấu trúc hệ viền chuyên xử lý ý nghĩa cảm xúc, phát hiện đe dọa và phản ứng sợ hãi."], ["Hồi hải mã (Hippocampus)", "Cấu trúc quan trọng đối với học tập, hình thành và chuyển đổi ký ức dài hạn."], ["Hệ giao cảm (Sympathetic)", "Nhánh thần kinh tự chủ kích hoạt phản ứng 'Chiến hay Biến' khi cơ thể gặp đe dọa."], ["Hệ đối giao cảm (Parasympathetic)", "Nhánh thần kinh tự chủ đưa cơ thể về trạng thái 'Nghỉ ngơi và Phục hồi'."], ["Neuroplasticity", "Tính mềm dẻo thần kinh: khả năng thay đổi cấu trúc và kết nối của não theo học tập và trải nghiệm."], ["Mô hình Ba não (Triune Brain)", "Mô hình MacLean chia não thành Não bò sát - Não viền - Não vỏ; hiện nay chỉ xem là ẩn dụ sư phạm."], ["Chủ nghĩa giản lược (Reductionism)", "Xu hướng sai lầm khi quy toàn bộ trải nghiệm phức tạp của con người về một yếu tố sinh học đơn lẻ."], ["Biopsychosocial Model", "Mô hình George Engel (1977): sức khỏe tâm lý là sự tương tác giữa Sinh học, Tâm lý và Xã hội."], ["Biopsychosocial-Spiritual", "Mô hình mở rộng thêm chiều kích tâm linh, ý nghĩa sống và hệ giá trị tinh thần nâng đỡ con người."], ["Trục HPA", "Trục Hypothalamus - Pituitary - Adrenal điều phối phản ứng stress dài hạn của cơ thể."]], "qs": [["Theo khoa học thần kinh hiện đại, mỗi cảm xúc tương ứng một vùng não riêng biệt hoạt động hoàn toàn độc lập.", ["True", "False"], 1, "Cảm xúc là kết quả hoạt động của nhiều mạng lưới thần kinh phức tạp liên kết với nhau."], ["Mô hình ba não của Paul MacLean có giá trị sư phạm nhưng hiện nay không được xem là bản đồ giải phẫu/tiến hóa chính xác.", ["True", "False"], 0, "Đúng, khoa học thần kinh hiện đại xem não là mạng lưới tích hợp, không phải 3 bộ não xếp chồng độc lập."], ["Tính mềm dẻo thần kinh (Neuroplasticity) có nghĩa là não có thể thay đổi theo ý muốn bất kể tuổi tác và hoàn cảnh.", ["True", "False"], 1, "Neuroplasticity có thật nhưng vẫn chịu giới hạn bởi độ tuổi, sinh học, sức khỏe và môi trường."], ["Trong mô hình Sinh học - Tâm lý - Xã hội - Tâm linh, yếu tố tâm linh nhất thiết phải gắn với tôn giáo hay thượng đế.", ["True", "False"], 1, "Spirituality rộng hơn tôn giáo; bao gồm ý nghĩa sống, mục đích, giá trị sâu sắc và cảm giác kết nối."], ["Chức năng nào dưới đây phù hợp nhất với vai trò của Vỏ não trước trán (Prefrontal Cortex - PFC)?", ["Điều hòa nhịp tim và hô hấp sinh tồn", "Lập kế hoạch, kiểm soát hành vi và ra quyết định", "Nơi duy nhất tạo ra cảm xúc sợ hãi", "Nơi duy nhất lưu trữ toàn bộ ký ức dài hạn"], 1, "PFC phụ trách các chức năng điều hành bậc cao: lập kế hoạch, kiểm soát xung động, chú ý, ra quyết định."], ["Sinh viên nói: 'Bạn ấy bị trầm cảm chắc chắn là do thiếu serotonin trong não'. Vấn đề chính trong cách giải thích này là gì?", ["Trầm cảm hoàn toàn không liên quan đến sinh học", "Serotonin không phải chất dẫn truyền thần kinh", "Đã giản lược một hiện tượng phức tạp thành một nguyên nhân sinh học đơn lẻ (Reductionism)", "Các rối loạn tâm lý chỉ do xã hội gây ra"], 2, "Trầm cảm là rối loạn đa yếu tố tương tác (Tâm - Sinh - Xã); quy về một chất là chủ nghĩa giản lược sinh học."], ["Sinh viên lo âu trước kỳ thi: ngủ 4 tiếng/đêm, nghĩ 'mình là kẻ thất bại', gia đình đặt kỳ vọng lớn. Phân loại theo Tâm - Sinh - Xã?", ["Ngủ 4 tiếng: tâm lý; Suy nghĩ thất bại: xã hội; Kỳ vọng gia đình: sinh học", "Ngủ 4 tiếng: sinh học; Suy nghĩ thất bại: tâm lý; Kỳ vọng gia đình: xã hội", "Ngủ 4 tiếng: xã hội; Suy nghĩ thất bại: sinh học; Kỳ vọng gia đình: tâm lý", "Cả 3 đều là yếu tố tâm lý"], 1, "Thiếu ngủ thuộc Sinh học; Niềm tin thất bại thuộc Tâm lý; Áp lực gia đình thuộc Xã hội."], ["Một người mất việc, mất ngủ, nghĩ 'mình vô dụng' và tự hỏi 'Cuộc đời mình còn ý nghĩa gì nữa?'. Câu hỏi cuối hướng đến chiều kích nào?", ["Sinh học", "Tâm lý", "Xã hội", "Tâm linh và Ý nghĩa sống (Spiritual)"], 3, "Ý nghĩa cuộc sống, mục đích tồn tại trực tiếp thuộc về chiều kích Spiritual."], ["Nhà tâm lý muốn hiểu tình trạng kiệt sức (burnout). Câu hỏi nào thể hiện trọn vẹn tư duy Biopsychosocial?", ["Vùng não nào đang bị teo lại do kiệt sức?", "Người này có suy nghĩ tiêu cực nào cần thay đổi?", "Những yếu tố cơ thể, cảm xúc, công việc và các mối quan hệ đang tương tác với nhau như thế nào?", "Nguyên nhân quan trọng nhất nằm ở cá nhân hay công ty?"], 2, "Tư duy Biopsychosocial tìm hiểu sự tương tác đa chiều giữa Sinh học, Tâm lý và Môi trường xã hội."], ["Thân chủ trải qua mất mát và tìm thấy hy vọng từ việc cầu nguyện trong cộng đồng tôn giáo. Nhà tâm lý nên tiếp cận thế nào?", ["Không đề cập vì tôn giáo không thuộc tâm lý học", "Khuyên thân chủ cầu nguyện nhiều hơn vì tôn giáo luôn tốt", "Tìm hiểu ý nghĩa của việc cầu nguyện và cộng đồng đối với thân chủ và xem đó có phải nguồn lực nâng đỡ họ không", "Giải thích rằng tôn giáo chỉ là ảo tưởng ứng phó"], 2, "Tiếp cận tôn trọng thế giới quan của thân chủ, nhận diện nguồn lực tinh thần nâng đỡ họ mà không áp đặt."], ["Bộ phận nào của neuron đóng vai trò nhận tín hiệu từ các tế bào khác truyền về thân tế bào?", ["Sợi trục (Axon)", "Sợi nhánh (Dendrites)", "Eo Ranvier", "Bao Myelin"], 1, "Dendrites (sợi nhánh) hoạt động như ăng-ten thu nhận tín hiệu từ các neuron khác."], ["Xung điện thế hoạt động (Action potential) lan truyền dọc theo sợi trục tuân theo nguyên tắc nào?", ["Tất-cả-hoặc-Không (All-or-None)", "Tăng dần theo khoảng cách", "Ngẫu nhiên tùy cảm xúc", "Chậm dần khi tới cúc tận cùng"], 0, "Nếu kích thích đạt ngưỡng, xung điện sẽ phát ra toàn bộ với biên độ tối đa; không đạt ngưỡng thì không phát ra."], ["Chất dẫn truyền thần kinh đóng vai trò là chất ức chế chính giúp làm dịu hệ thần kinh là:", ["Glutamate", "Dopamine", "GABA", "Acetylcholine"], 2, "GABA là chất dẫn truyền thần kinh ức chế chính trong não bộ, giúp giảm lo âu và căng thẳng."], ["Hệ thần kinh giao cảm (Sympathetic) kích hoạt phản ứng nào của cơ thể khi đối mặt mối nguy hiểm?", ["Giảm nhịp tim và tăng tiết dịch tiêu hóa", "Đồng tử co nhỏ và giảm hô hấp", "Phản ứng 'Chiến hay Biến': tăng nhịp tim, thở gấp, giãn đồng tử", "Tạo cảm giác buồn ngủ sâu"], 2, "Hệ giao cảm kích hoạt trạng thái sẵn sàng chiến đấu hoặc tháo chạy (Fight or Flight)."], ["Bệnh nhân Betty bị đột quỵ nhẹ ở bán cầu phải, thị lực tốt nhưng không thể nhận ra k /* ---------- Storage & State ---------- */
const STORE_KEY = "tamlyhoc_review_v2";
let S = { q: {}, c: {}, exam: [] };
try {
  const saved = localStorage.getItem(STORE_KEY);
  if(saved) S = JSON.parse(saved);
} catch(e) {}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){}
}

let state = { view: "home", tab: "sum" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function mastery(l) {
  let ok = 0, done = 0;
  l.qs.forEach((q, idx) => {
    const st = S.q[l.id + "-" + idx];
    if(st && st.done) { done++; if(st.ok) ok++; }
  });
  return { ok, done, total: l.qs.length, pct: l.qs.length ? Math.round(ok / l.qs.length * 100) : 0 };
}

function wrongIds() {
  const res = [];
  LESSONS.forEach(l => {
    l.qs.forEach((q, idx) => {
      const qid = l.id + "-" + idx;
      if(S.q[qid] && S.q[qid].done && !S.q[qid].ok) res.push(qid);
    });
  });
  return res;
}

function cardStats(l) {
  let known = 0;
  l.cards.forEach((c, idx) => {
    if(S.c[l.id + "-" + idx] === "known") known++;
  });
  return { known, total: l.cards.length };
}

/* ---------- Navigation & Router ---------- */
function go(view, tab) {
  stopTimer();
  state.view = view;
  if(tab) state.tab = tab;
  else if(BYID[view] && view !== state.lastLesson) state.tab = "sum";
  if(BYID[view]) state.lastLesson = view;

  renderSide();
  const m = $("#main");
  if(view === "home") renderHome(m);
  else if(view === "exam") renderExamSetup(m);
  else if(view === "wrong") renderWrong(m);
  else if(view === "search") renderSearch(m);
  else if(BYID[view]) renderLesson(m, BYID[view]);

  $("#topTitle").textContent = BYID[view] ? BYID[view].code + " " + BYID[view].title : 
    ({ home: "Tổng quan môn học", exam: "Thi thử trắc nghiệm", wrong: "Ôn tập câu đã sai", search: "Tra cứu kiến thức" }[view] || "Tâm lý học đại cương");
  window.scrollTo(0, 0);
  $("#side").classList.remove("open");
}

/* ---------- Render Sidebar ---------- */
function renderSide() {
  $("#navHome").classList.toggle("on", state.view === "home");
  $("#wrongCount").textContent = wrongIds().length;

  let html = "", curPart = "";
  LESSONS.forEach(l => {
    if(l.part !== curPart) {
      curPart = l.part;
      html += `<div class="part-label">${esc(curPart)}</div>`;
    }
    const s = mastery(l);
    const on = state.view === l.id ? " on" : "";
    html += `
    <button class="lesson-btn${on}" data-go="${l.id}" data-tab="sum">
      <span class="code">${l.code}</span>
      <span class="name">${esc(l.title)}</span>
      <span class="mini"><i style="width:${s.pct}%"></i></span>
    </button>`;
  });
  $("#sideLessons").innerHTML = html;
  bindNavClicks(document);
}

function bindNavClicks(root) {
  root.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      go(el.dataset.go, el.dataset.tab);
    };
  });
}

/* ---------- Mindmap SVG Engine ---------- */
const MMC = ["#3B4A8C", "#D98A1F", "#1E8C86", "#C8366E", "#7A5BC7", "#2A7FB8", "#6F8A2E", "#B0683A", "#4F6D7A"];

function treeSVG(root, ci0) {
  const LH = 36, PX = 14, NX = 12;
  const tw = (t, px, b) => t.length * px * (b ? 0.6 : 0.53);
  let leaves = 0, cc = 0;
  const nodes = [];

  (function walk(n, d, parent, ci) {
    if (d === 1 || d === 2) ci = cc++;
    const o = { t: n[0], note: n[1] || "", rel: n[2] || "", d, parent, ci, kids: [] };
    o.w = tw(o.t, PX, 1) + (o.note ? tw(" – " + o.note, NX) : 0) + 28;
    o.rw = o.rel ? tw(o.rel, 12) + 20 : 0;
    nodes.push(o);

    const ch = n[3] || [];
    if (!ch.length) {
      o.y = leaves * LH + LH / 2 + 8;
      leaves++;
    }
    ch.forEach(c => o.kids.push(walk(c, d + 1, o, ci)));
    if (ch.length) o.y = (o.kids[0].y + o.kids[o.kids.length - 1].y) / 2;
    return o;
  })(root, 0, null, 0);

  const maxD = Math.max(...nodes.map(n => n.d));
  const colX = [12];
  for (let d = 0; d < maxD; d++) {
    const at = nodes.filter(n => n.d === d);
    colX[d + 1] = colX[d] + Math.max(...at.map(n => n.w)) + Math.max(56, Math.max(...at.map(n => n.rw)) + 44);
  }

  const W = Math.max(...nodes.map(n => colX[n.d] + n.w)) + 24;
  const H = Math.max(leaves * LH + 24, 70);

  let edges = "", body = "";
  nodes.forEach(n => {
    const x = colX[n.d], col = MMC[(n.ci + ci0) % MMC.length];
    if (n.kids.length) {
      const sx = x + n.w;
      let ex = sx;
      if (n.rel) {
        const px = sx + 8;
        body += `<rect x="${px}" y="${n.y - 11}" width="${n.rw}" height="22" rx="11" fill="var(--surface)" stroke="${n.d === 0 ? "var(--muted)" : col}" stroke-width="1.2"/><text x="${px + n.rw / 2}" y="${n.y + 4.3}" text-anchor="middle" font-size="11.5" font-style="italic" fill="${n.d === 0 ? "var(--muted)" : col}">${esc(n.rel)}</text>`;
        edges += `<path d="M${sx},${n.y} H${px}" stroke="${n.d === 0 ? "var(--muted)" : col}" stroke-width="2"/>`;
        ex = px + n.rw;
      }
      n.kids.forEach(k => {
        const kc = MMC[(k.ci + ci0) % MMC.length];
        const kx = colX[k.d];
        const mx = (ex + kx) / 2;
        edges += `<path d="M${ex},${n.y} C${mx},${n.y} ${mx},${k.y} ${kx},${k.y}" fill="none" stroke="${kc}" stroke-width="2" opacity=".75"/>`;
      });
    }

    const fill = n.d === 0 ? "var(--ink)" : n.d === 1 ? col : "var(--surface)";
    const tcol = n.d === 0 ? "var(--paper)" : n.d === 1 ? "#fff" : "var(--ink)";
    body += `<rect x="${x}" y="${n.y - 14}" width="${n.w}" height="28" rx="${n.d < 2 ? 14 : 8}" fill="${fill}" ${n.d >= 2 ? `stroke="${col}" stroke-width="1.5"` : ""}/>`;
    body += `<text x="${x + 14}" y="${n.y + 5}" font-size="${PX}" fill="${tcol}"><tspan font-weight="700">${esc(n.t)}</tspan>${n.note ? `<tspan font-size="${NX}" ${n.d >= 2 ? `fill="var(--muted)"` : `fill-opacity=".85"`}> – ${esc(n.note)}</tspan>` : ""}</text>`;
  });

  return `<svg viewBox="0 0 ${Math.ceil(W)} ${H}" style="min-width:${Math.round(W * 0.72)}px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ tư duy: ${esc(root[0])}" font-family="inherit">${edges}${body}</svg>`;
}

function renderTrees(l) {
  if (!l.trees || !l.trees.length) return "";
  return l.trees.map((t, i) => `
    <div class="tree">
      <div class="mm-scroll">${treeSVG(t, i * 2)}</div>
    </div>
  `).join("");
}

/* Tab: Thẻ nhớ (Flashcard) */
let FC = { list: [], i: 0 };
function renderCards(p, l) {
  FC.list = l.cards.map((c, i) => i);
  FC.i = 0;

  const draw = () => {
    const ci = FC.list[FC.i];
    const card = l.cards[ci];
    const st = S.c[l.id + "-" + ci];
    const cs = cardStats(l);

    p.innerHTML = `
    <div class="toolbar">
      <div style="font-size:14px; font-weight:600; color:var(--muted)">
        Thẻ ${FC.i + 1} / ${FC.list.length} (Đã thuộc: ${cs.known}/${cs.total})
      </div>
      <div class="row">
        <button class="btn ghost" id="fcShuf">🔀 Xáo trộn</button>
      </div>
    </div>

    <div class="fc-stage">
      <button class="fc" id="fcCard" aria-label="Lật thẻ">
        <div class="face front">
          <span class="fc-tag ${st||'learning'}">${st==='known'?'Đã thuộc':'Đang học'}</span>
          <div class="term">${esc(card[0])}</div>
          <div class="hint">Nhấn vào thẻ hoặc bấm phím Cách (Space) để xem định nghĩa</div>
        </div>
        <div class="face back">
          <span class="fc-tag ${st||'learning'}">${st==='known'?'Đã thuộc':'Đang học'}</span>
          <div class="def">${esc(card[1])}</div>
          <div class="hint">Nhấn lại để quay về mặt trước</div>
        </div>
      </button>
    </div>

    <div class="fc-controls">
      <button class="btn again" id="fcAgain">❌ Chưa thuộc (Phím 1)</button>
      <div class="row">
        <button class="btn" id="fcPrev">← Trước</button>
        <button class="btn" id="fcNext">Sau →</button>
      </div>
      <button class="btn know" id="fcKnow">✅ Đã thuộc (Phím 2)</button>
    </div>`;

    const cardEl = $("#fcCard");
    cardEl.onclick = () => cardEl.classList.toggle("flip");

    $("#fcPrev").onclick = () => { if(FC.i > 0) { FC.i--; draw(); } };
    $("#fcNext").onclick = () => { if(FC.i < FC.list.length - 1) { FC.i++; draw(); } };
    $("#fcShuf").onclick = () => {
      for (let j = FC.list.length - 1; j > 0; j--) {
        const k = Math.floor(Math.random() * (j + 1));
        [FC.list[j], FC.list[k]] = [FC.list[k], FC.list[j]];
      }
      FC.i = 0; draw();
    };

    const mark = (v) => {
      S.c[l.id + "-" + ci] = v;
      save();
      if(FC.i < FC.list.length - 1) FC.i++;
      draw();
    };
    $("#fcAgain").onclick = () => mark("learning");
    $("#fcKnow").onclick = () => mark("known");
  };
  draw();
}

/* Tab: Luyện tập (Quiz Practice) */
let QZ = {};
const LETTERS = ["A", "B", "C", "D"];
function renderPractice(p, l) {
  let mode = "all";
  const start = (m) => {
    mode = m;
    let list = l.qs.map((q, idx) => ({ q, idx, pick: null }));
    if(m === "new") list = list.filter(item => !S.q[l.id + "-" + item.idx]);
    else if(m === "wrong") list = list.filter(item => S.q[l.id + "-" + item.idx] && !S.q[l.id + "-" + item.idx].ok);

    if(!list.length) {
      p.innerHTML = `
      <div class="toolbar">
        <div class="seg-ctrl" id="qzModes">
          <button data-m="all" class="${mode==='all'?'on':''}">Tất cả (${l.qs.length})</button>
          <button data-m="new" class="${mode==='new'?'on':''}">Chưa làm</button>
          <button data-m="wrong" class="${mode==='wrong'?'on':''}">Câu làm sai</button>
        </div>
      </div>
      <div class="empty" style="padding:40px; text-align:center; background:var(--surface); border-radius:var(--r-md); margin-top:14px">
        🎉 Không có câu hỏi nào trong danh mục này!
      </div>`;
      bindModes();
      return;
    }

    QZ = { list, i: 0, okCount: 0 };
    draw();
  };

  const bindModes = () => {
    p.querySelectorAll("#qzModes button").forEach(b => {
      b.onclick = () => start(b.dataset.m);
    });
  };

  const draw = () => {
    const it = QZ.list[QZ.i];
    if(!it) {
      const pct = Math.round(QZ.okCount / QZ.list.length * 100);
      p.innerHTML = `
      <div class="score">
        <div class="big">${pct}%</div>
        <div>
          <h3>Hoàn thành đợt luyện tập!</h3>
          <p style="margin:4px 0; color:var(--muted)">Bạn đã trả lời đúng <b>${QZ.okCount} / ${QZ.list.length}</b> câu.</p>
        </div>
        <div style="margin-left:auto"><button class="btn primary" id="qzRetry">Luyện tập lại</button></div>
      </div>`;
      $("#qzRetry").onclick = () => start(mode);
      return;
    }

    const q = it.q;
    const answered = it.pick !== null;

    p.innerHTML = `
    <div class="toolbar">
      <div class="seg-ctrl" id="qzModes">
        <button data-m="all" class="${mode==='all'?'on':''}">Tất cả (${l.qs.length})</button>
        <button data-m="new" class="${mode==='new'?'on':''}">Chưa làm</button>
        <button data-m="wrong" class="${mode==='wrong'?'on':''}">Câu làm sai</button>
      </div>
      <div style="font-size:13.5px; font-weight:600; color:var(--muted)">
        Câu ${QZ.i + 1} / ${QZ.list.length}
      </div>
    </div>
    <div class="progress"><i style="width:${(QZ.i)/QZ.list.length*100}%"></i></div>

    <div class="qcard">
      <div class="qmeta">
        <span>${l.code} • ${esc(l.title)}</span>
        <span>Câu hỏi trắc nghiệm</span>
      </div>
      <div class="qtext">${esc(q[0])}</div>
      <div class="opts">
        ${q[1].map((opt, oi) => {
          let cls = "";
          if(answered) {
            if(oi === q[2]) cls = " ok";
            else if(oi === it.pick) cls = " bad";
          }
          return `
          <button class="opt${cls}" data-oi="${oi}" ${answered?'disabled':''}>
            <span class="k">${LETTERS[oi]}</span>
            <span>${esc(opt)}</span>
          </button>`;
        }).join("")}
      </div>

      ${answered ? `
      <div class="explain ${it.pick===q[2]?'':'wrong'}">
        <strong>${it.pick===q[2]?'✅ Chính xác!':'❌ Chưa chính xác!'} (Đáp án đúng: ${LETTERS[q[2]]})</strong>
        <div>${esc(q[3])}</div>
      </div>
      <div class="qnav">
        <div></div>
        <button class="btn primary" id="qzNext">Câu tiếp theo →</button>
      </div>` : ''}
    </div>`;

    bindModes();

    p.querySelectorAll(".opt").forEach(btn => {
      btn.onclick = () => {
        const oi = parseInt(btn.dataset.oi, 10);
        it.pick = oi;
        const isOk = oi === q[2];
        if(isOk) QZ.okCount++;
        S.q[l.id + "-" + it.idx] = { done: true, ok: isOk, time: Date.now() };
        save();
        renderSide();
        draw();
      };
    });

    const nextBtn = $("#qzNext");
    if(nextBtn) nextBtn.onclick = () => { QZ.i++; draw(); };
  };

  start("all");
}

/* ---------- Exam Mode ---------- */
let TIMER = null;
function stopTimer() { if(TIMER) { clearInterval(TIMER); TIMER = null; } }

function renderExamSetup(m) {
  m.innerHTML = `
  <div class="exam-setup">
    <h2>Thi thử Trắc nghiệm Tâm lý học đại cương</h2>
    <p style="color:var(--muted)">Đề thi sẽ tổng hợp ngẫu nhiên các câu hỏi từ các bài học được chọn, bấm giờ làm bài và chấm điểm như kỳ thi thật.</p>
    
    <h4 style="margin:20px 0 8px">1. Chọn bài học đưa vào đề thi:</h4>
    <div class="checks">
      ${LESSONS.map(l => `
        <label class="check">
          <input type="checkbox" value="${l.id}" checked>
          <span><b>${l.code}</b> – ${esc(l.title)} (${l.qs.length} câu)</span>
        </label>
      `).join("")}
    </div>

    <h4 style="margin:16px 0 8px">2. Chọn số lượng câu hỏi & thời gian:</h4>
    <div class="row" id="examSizeRow" style="margin-bottom:24px">
      <button class="btn ghost on" data-n="20" data-t="20">20 câu (20 phút)</button>
      <button class="btn ghost" data-n="40" data-t="40">40 câu (40 phút)</button>
      <button class="btn ghost" data-n="60" data-t="60">Tất cả 60 câu (60 phút)</button>
    </div>

    <button class="btn primary" id="startExamBtn" style="padding:12px 24px; font-size:15px">🚀 Bắt đầu làm bài thi</button>
  </div>`;

  let selectedN = 20, selectedT = 20;
  m.querySelectorAll("#examSizeRow button").forEach(b => {
    b.onclick = () => {
      m.querySelectorAll("#examSizeRow button").forEach(x => x.classList.remove("on", "primary"));
      b.classList.add("primary");
      selectedN = parseInt(b.dataset.n, 10);
      selectedT = parseInt(b.dataset.t, 10);
    };
  });

  $("#startExamBtn").onclick = () => {
    const checkedIds = [...m.querySelectorAll(".checks input:checked")].map(i => i.value);
    if(!checkedIds.length) { alert("Vui lòng chọn ít nhất 1 bài học!"); return; }

    let pool = [];
    checkedIds.forEach(lid => {
      BYID[lid].qs.forEach((q, idx) => pool.push({ q, lid, idx }));
    });

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    const examList = pool.slice(0, Math.min(selectedN, pool.length)).map(item => ({
      ...item, pick: null
    }));

    runExam(m, examList, selectedT);
  };
}

function runExam(m, list, minutes) {
  let cur = 0;
  let remaining = minutes * 60;

  const tick = () => {
    remaining--;
    const el = $("#examTimer");
    if(el) {
      const min = Math.floor(remaining / 60);
      const sec = remaining % 60;
      el.textContent = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
      if(remaining < 300) el.classList.add("low");
    }
    if(remaining <= 0) {
      stopTimer();
      finishExam(m, list);
    }
  };
  TIMER = setInterval(tick, 1000);

  const drawQ = () => {
    const it = list[cur];
    const q = it.q;
    const l = BYID[it.lid];

    m.innerHTML = `
    <div class="toolbar">
      <div>
        <h3 style="margin:0">Đề thi thử Trắc nghiệm</h3>
        <span style="font-size:13px; color:var(--muted)">Đang làm câu ${cur + 1} / ${list.length}</span>
      </div>
      <div class="row">
        <span class="timer" id="examTimer">--:--</span>
        <button class="btn dark" id="finishExamBtn">Nộp bài thi</button>
      </div>
    </div>

    <div class="qcard" style="margin-top:14px">
      <div class="qmeta">
        <span>${l.code} • ${esc(l.title)}</span>
        <span>Câu ${cur + 1}</span>
      </div>
      <div class="qtext">${esc(q[0])}</div>
      <div class="opts">
        ${q[1].map((opt, oi) => `
          <button class="opt${it.pick===oi?' sel':''}" data-oi="${oi}">
            <span class="k">${LETTERS[oi]}</span>
            <span>${esc(opt)}</span>
          </button>
        `).join("")}
      </div>
      <div class="qnav">
        <button class="btn ghost" id="exPrev" ${cur===0?'disabled':''}>← Câu trước</button>
        <button class="btn ghost" id="exNext" ${cur===list.length-1?'disabled':''}>Câu sau →</button>
      </div>
    </div>

    <div style="margin-top:20px; font-weight:700; font-size:14px">Danh sách câu hỏi:</div>
    <div class="qgrid" id="examGrid">
      ${list.map((item, idx) => `
        <button class="${idx===cur?'cur':''} ${item.pick!==null?'done':''}" data-jump="${idx}">${idx + 1}</button>
      `).join("")}
    </div>`;

    tick();

    m.querySelectorAll(".opt").forEach(btn => {
      btn.onclick = () => {
        it.pick = parseInt(btn.dataset.oi, 10);
        drawQ();
      };
    });

    $("#exPrev").onclick = () => { if(cur > 0) { cur--; drawQ(); } };
    $("#exNext").onclick = () => { if(cur < list.length - 1) { cur++; drawQ(); } };

    m.querySelectorAll("#examGrid button").forEach(b => {
      b.onclick = () => { cur = parseInt(b.dataset.jump, 10); drawQ(); };
    });

    $("#finishExamBtn").onclick = () => {
      const unans = list.filter(x => x.pick === null).length;
      if(unans > 0) {
        if(!confirm(`Bạn còn ${unans} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`)) return;
      }
      stopTimer();
      finishExam(m, list);
    };
  };

  drawQ();
}

function finishExam(m, list) {
  let ok = 0;
  const byLesson = {};
  list.forEach(it => {
    const isOk = it.pick === it.q[2];
    if(isOk) ok++;
    if(!byLesson[it.lid]) byLesson[it.lid] = { ok: 0, tot: 0 };
    byLesson[it.lid].tot++;
    if(isOk) byLesson[it.lid].ok++;

    S.q[it.lid + "-" + it.idx] = { done: true, ok: isOk, time: Date.now() };
  });
  save();

  const score10 = (ok / list.length * 10).toFixed(1);
  const wrongList = list.filter(it => it.pick !== it.q[2]);

  m.innerHTML = `
  <div class="score">
    <div class="big">${score10}</div>
    <div>
      <h2 style="margin:0 0 6px">Kết quả bài thi</h2>
      <p style="margin:0; color:var(--muted)">Đạt <b>${ok} / ${list.length}</b> câu đúng (${Math.round(ok/list.length*100)}%).</p>
    </div>
    <div style="margin-left:auto" class="row">
      <button class="btn primary" data-go="exam">Làm đề mới</button>
      <button class="btn ghost" data-go="home">Về trang chủ</button>
    </div>
  </div>

  <h3 style="font-size:16px; margin:24px 0 10px">Kết quả theo từng bài học:</h3>
  <div class="breakdown">
    ${Object.keys(byLesson).map(lid => {
      const b = byLesson[lid];
      const l = BYID[lid];
      const pct = Math.round(b.ok / b.tot * 100);
      return `
      <div class="brow">
        <b>${l.code}</b>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span style="text-align:right">${b.ok}/${b.tot} (${pct}%)</span>
      </div>`;
    }).join("")}
  </div>

  <h3 style="font-size:16px; margin:30px 0 12px">Xem lại các câu làm sai (${wrongList.length} câu):</h3>
  ${wrongList.length === 0 ? `<div class="empty">🎉 Xuất sắc! Bạn không làm sai câu nào!</div>` : 
    wrongList.map(it => {
      const q = it.q;
      const l = BYID[it.lid];
      return `
      <div class="review-item">
        <div style="font-size:12px; color:var(--muted); margin-bottom:4px">${l.code} – ${esc(l.title)}</div>
        <div class="q">${esc(q[0])}</div>
        <div style="font-size:14px; margin-bottom:4px">
          Bạn chọn: <span class="a-bad">${it.pick!==null?LETTERS[it.pick]+'. '+esc(q[1][it.pick]):'Chưa chọn'}</span>
        </div>
        <div style="font-size:14px; margin-bottom:8px">
          Đáp án đúng: <span class="a-ok">${LETTERS[q[2]]}. ${esc(q[1][q[2]])}</span>
        </div>
        <div style="font-size:13px; color:var(--muted); background:var(--surface2); padding:8px 12px; border-radius:6px">
          💡 <b>Giải thích:</b> ${esc(q[3])}
        </div>
      </div>`;
    }).join("")
  }`;

  bindNavClicks(m);
}

/* ---------- Wrong Questions View ---------- */
function renderWrong(m) {
  const ids = wrongIds();
  if(!ids.length) {
    m.innerHTML = `
    <div class="empty" style="padding:60px 20px; text-align:center">
      <h2>🎉 Chúc mừng bạn!</h2>
      <p style="color:var(--muted)">Bạn hiện không có câu hỏi nào bị làm sai. Hãy tiếp tục luyện tập các bài học hoặc làm đề thi thử!</p>
      <button class="btn primary" data-go="home" style="margin-top:14px">Về danh sách bài học</button>
    </div>`;
    bindNavClicks(m);
    return;
  }

  const list = ids.map(id => {
    const [lid, qidx] = id.split("-");
    return { q: BYID[lid].qs[parseInt(qidx,10)], lid, idx: parseInt(qidx,10), pick: null };
  });

  let cur = 0, okCount = 0;
  const draw = () => {
    if(cur >= list.length) {
      m.innerHTML = `
      <div class="score">
        <div class="big">${Math.round(okCount/list.length*100)}%</div>
        <div>
          <h3>Hoàn thành đợt ôn câu sai!</h3>
          <p style="margin:4px 0; color:var(--muted)">Bạn đã sửa đúng <b>${okCount} / ${list.length}</b> câu.</p>
        </div>
        <div style="margin-left:auto"><button class="btn primary" data-go="wrong">Ôn tiếp câu sai còn lại</button></div>
      </div>`;
      bindNavClicks(m);
      return;
    }

    const it = list[cur];
    const q = it.q;
    const l = BYID[it.lid];
    const answered = it.pick !== null;

    m.innerHTML = `
    <div class="toolbar">
      <h3 style="margin:0">Ôn tập các câu làm sai (${ids.length} câu cần ôn)</h3>
      <span style="font-size:13.5px; color:var(--muted)">Câu ${cur + 1} / ${list.length}</span>
    </div>
    <div class="progress"><i style="width:${cur/list.length*100}%"></i></div>

    <div class="qcard">
      <div class="qmeta">
        <span>${l.code} • ${esc(l.title)}</span>
        <span>Ôn câu sai</span>
      </div>
      <div class="qtext">${esc(q[0])}</div>
      <div class="opts">
        ${q[1].map((opt, oi) => {
          let cls = "";
          if(answered) {
            if(oi === q[2]) cls = " ok";
            else if(oi === it.pick) cls = " bad";
          }
          return `
          <button class="opt${cls}" data-oi="${oi}" ${answered?'disabled':''}>
            <span class="k">${LETTERS[oi]}</span>
            <span>${esc(opt)}</span>
          </button>`;
        }).join("")}
      </div>

      ${answered ? `
      <div class="explain ${it.pick===q[2]?'':'wrong'}">
        <strong>${it.pick===q[2]?'✅ Đã sửa đúng!':'❌ Vẫn chưa đúng!'} (Đáp án đúng: ${LETTERS[q[2]]})</strong>
        <div>${esc(q[3])}</div>
      </div>
      <div class="qnav">
        <div></div>
        <button class="btn primary" id="wrongNext">Câu tiếp theo →</button>
      </div>` : ''}
    </div>`;

    m.querySelectorAll(".opt").forEach(btn => {
      btn.onclick = () => {
        const oi = parseInt(btn.dataset.oi, 10);
        it.pick = oi;
        const isOk = oi === q[2];
        if(isOk) {
          okCount++;
          S.q[it.lid + "-" + it.idx] = { done: true, ok: true, time: Date.now() };
        }
        save();
        renderSide();
        draw();
      };
    });

    const nextBtn = $("#wrongNext");
    if(nextBtn) nextBtn.onclick = () => { cur++; draw(); };
  };

  draw();
}

/* ---------- Search View ---------- */
function renderSearch(m) {
  m.innerHTML = `
  <div>
    <h2>Tra cứu toàn diện kiến thức</h2>
    <input type="search" class="search" id="searchInput" placeholder="Nhập từ khóa (ví dụ: vô thức, CBT, neuron, amygdala, DEAL, Pavlov, 1879...)" autofocus>
    <div class="sres" id="searchResults"></div>
  </div>`;

  const input = $("#searchInput");
  const res = $("#searchResults");

  const run = () => {
    const q = input.value.trim().toLowerCase();
    if(q.length < 2) {
      res.innerHTML = `<div style="color:var(--muted); font-size:14px">Nhập từ khóa ít nhất 2 ký tự để tìm kiếm...</div>`;
      return;
    }

    const matches = [];
    LESSONS.forEach(l => {
      l.sections.forEach(s => {
        s.items.forEach(it => {
          if(it.toLowerCase().includes(q) || s.h.toLowerCase().includes(q)) {
            matches.push({ type: "Lý thuyết", title: s.h, desc: it.replace(/<[^>]+>/g, ''), lid: l.id });
          }
        });
      });
      l.cards.forEach(c => {
        if(c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q)) {
          matches.push({ type: "Thẻ nhớ", title: c[0], desc: c[1], lid: l.id });
        }
      });
      l.qs.forEach(question => {
        if(question[0].toLowerCase().includes(q) || question[3].toLowerCase().includes(q)) {
          matches.push({ type: "Câu trắc nghiệm", title: question[0], desc: "Giải thích: " + question[3], lid: l.id });
        }
      });
    });

    if(!matches.length) {
      res.innerHTML = `<div class="empty">Không tìm thấy nội dung nào chứa từ khóa "${esc(q)}".</div>`;
      return;
    }

    res.innerHTML = matches.slice(0, 30).map(m => `
      <div class="item" data-go="${m.lid}" data-tab="sum">
        <div style="display:flex; justify-content:space-between; margin-bottom:4px">
          <span class="w">${esc(m.title)}</span>
          <span class="chip-btn" style="padding:2px 8px; font-size:11px">${m.type}</span>
        </div>
        <div style="font-size:13.5px; line-height:1.45; color:var(--ink)">${esc(m.desc)}</div>
        <div class="from">Thuộc bài: <b>${BYID[m.lid].code} – ${esc(BYID[m.lid].title)}</b></div>
      </div>
    `).join("");

    bindNavClicks(res);
  };

  input.oninput = run;
  run();
}

/* ---------- Theme toggle & Mobile menu ---------- */
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("psy_theme", next); } catch(e){}
};
try {
  const savedTheme = localStorage.getItem("psy_theme");
  if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
} catch(e){}

// Keyboard shortcuts for flashcard
window.addEventListener("keydown", (e) => {
  if(state.tab === "fc") {
    if(e.code === "Space") {
      const f = $("#fcCard");
      if(f) { e.preventDefault(); f.classList.toggle("flip"); }
    } else if(e.key === "1") {
      const b = $("#fcAgain"); if(b) b.click();
    } else if(e.key === "2") {
      const b = $("#fcKnow"); if(b) b.click();
    } else if(e.code === "ArrowRight") {
      const b = $("#fcNext"); if(b) b.click();
    } else if(e.code === "ArrowLeft") {
      const b = $("#fcPrev"); if(b) b.click();
    }
  }
});

// Initial boot
go("home");
</script>
