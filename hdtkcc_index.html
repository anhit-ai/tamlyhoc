iễn dịch, viêm loét dạ dày", "", []], ["Can thiệp phục hồi", "thở chậm kích hoạt dây X đối giao cảm làm dịu tim mạch", "", []]]]]]]}, {"id": "tk5", "part": "Phần II: HĐTK Cấp cao & Hiện tượng Tâm lý", "code": "TK.5", "title": "Quy luật Hưng phấn – Ức chế & Phản xạ Có điều kiện", "goals": ["Trình bày 2 quá trình thần kinh cơ bản (Hưng phấn, Ức chế) và các quy luật hoạt động của vỏ não.", "Mô tả quá trình hình thành Phản xạ có điều kiện của Pavlov và cơ chế đường liên hệ tạm thời.", "Phân biệt và so sánh toàn diện Ức chế Không điều kiện (Ngoại sinh) và Ức chế Có điều kiện (Nội sinh).", "Nắm vững ý nghĩa thích nghi sinh học và vận dụng vào hình thành thói quen, kỹ năng tâm lý."], "sections": [{"h": "Hai Quá trình Thần kinh Cơ bản & Các Quy luật Vỏ não", "items": ["<b>Hai quá trình thần kinh cơ bản:</b> Toàn bộ hoạt động phức tạp của vỏ não đều dựa trên sự đối lập và thống nhất của hai quá trình:", "• <b>Hưng phấn (Excitation):</b> Quá trình nơ-ron phát xung động, kích thích cơ quan đáp ứng chuyển từ trạng thái nghỉ sang hoạt động hoặc tăng cường hoạt động.", "• <b>Ức chế (Inhibition):</b> Quá trình làm kìm hãm, suy giảm hoặc chấm dứt hoạt động đang diễn ra của nơ-ron hoặc cơ quan đáp ứng.", "<b>Ba quy luật hoạt động của vỏ não (Pavlov):</b>", "• <i>1. Quy luật Lan tỏa & Tập trung:</i> Một điểm hưng phấn hay ức chế ban đầu sẽ lan rộng ra các vùng xung quanh (Lan tỏa); sau đó thu hẹp lại tại điểm xuất phát (Tập trung). Vd: Mới tập lái xe thì gồng toàn thân (lan tỏa), tập thuần thục chỉ cử động cổ tay và chân (tập trung).", "• <i>2. Quy luật Cảm ứng qua lại (Induction):</i> Một quá trình này gây ra hoặc tăng cường quá trình kia:", "  - <i>Cảm ứng đồng thời:</i> Ổ hưng phấn ở một điểm làm xuất hiện ổ ức chế ở các vùng lân cận (vd: đang tập trung cao độ đọc sách thì không nghe thấy tiếng người gọi xung quanh).", "  - <i>Cảm ứng tiếp diễn:</i> Ngay tại một điểm, sau hưng phấn mạnh sẽ chuyển sang ức chế sâu sắc (vd: sau một đợt thi cử căng thẳng thì rơi vào trạng thái ngủ say li bì).", "• <i>3. Quy luật Tương quan Cường độ:</i> Trong giới hạn bình thường, cường độ kích thích càng mạnh thì phản ứng đáp ứng của vỏ não càng lớn."]}, {"h": "Phản xạ Có điều kiện (PX CĐK) & Đường liên hệ Thần kinh Tạm thời", "items": ["<b>Thí nghiệm kinh điển của I.P. Pavlov:</b>", "• Thức ăn (Kích thích không điều kiện - US) → Tiết nước bọt (Phản xạ không điều kiện - UR).", "• Ánh đèn/Tiếng chuông (Kích thích trung tính) → Không tiết nước bọt.", "• Bật đèn/chuông kết hợp cho ăn (lặp lại nhiều lần) → Ánh đèn/chuông trở thành Kích thích có điều kiện (CS) → Tiết nước bọt (Phản xạ có điều kiện - CR).", "<b>Bốn điều kiện bắt buộc để thành lập PX CĐK:</b>", "1. Kích thích có điều kiện (chuông) phải <b>đi trước</b> kích thích không điều kiện (thức ăn) một khoảng thời gian ngắn (vài giây đến nửa phút).", "2. Kích thích có điều kiện phải trơ về mặt sinh học (không gây phản xạ quá mạnh dập tắt kích thích kia).", "3. Vỏ não phải hoàn toàn <b>tỉnh táo, khỏe mạnh</b>, không bị ngộ độc hoặc ức chế.", "4. Môi trường xung quanh phải yên tĩnh, <b>không có kích thích lạ</b> làm xao nhãng.", "<b>Cơ chế sinh lý học cốt lõi:</b> Sự hình thành <b>ĐƯỜNG LIÊN HỆ THẦN KINH TẠM THỜI (Temporary Neural Connection)</b> trên vỏ não giữa trung khu cảm giác tiếp nhận kích thích có điều kiện và trung khu của phản xạ không điều kiện."]}, {"h": "Ức chế Không điều kiện (Ức chế Ngoại sinh)", "items": ["<b>Đặc điểm chung:</b> Mang tính bẩm sinh, không cần qua tập luyện, xuất hiện ngay khi có tác nhân tương ứng tác động.", "<b>Gồm 2 dạng ức chế:</b>", "• <b>1. Ức chế bộc phát (Ức chế ngoại lai):</b> Xuất hiện khi có một kích thích lạ, bất ngờ tác động từ bên ngoài làm xuất hiện phản xạ định hướng 'Cái gì thế?'. Phản xạ định hướng này tạo ra một ổ hưng phấn mới dập tắt phản xạ có điều kiện đang diễn ra theo quy luật cảm ứng đồng thời. (Vd: Học sinh đang chăm chú nghe giảng bỗng nghe tiếng nổ ngoài sân trường liền gián đoạn bài học).", "• <b>2. Ức chế vượt hạn (Ức chế bảo vệ):</b> Xuất hiện khi cường độ kích thích quá mạnh hoặc kéo dài vượt quá giới hạn chịu đựng chức năng của tế bào vỏ não. Khi đó tế bào vỏ não tự động chuyển sang trạng thái ức chế để bảo vệ nơ-ron không bị cạn kiệt năng lượng và hoại tử.", "• <b>Bản chất của giấc ngủ tự nhiên:</b> Giấc ngủ chính là sự lan tỏa của ức chế bảo vệ ra toàn bộ vỏ bán cầu đại não và các tầng dưới vỏ."]}, {"h": "Ức chế Có điều kiện (Ức chế Nội sinh)", "items": ["<b>Đặc điểm chung:</b> Không có sẵn bẩm sinh; phải trải qua quá trình <b>tập luyện và hình thành trong đời sống cá thể</b>; giúp hành vi thích nghi tinh vi với biến đổi môi trường.", "<b>Gồm 4 dạng ức chế:</b>", "• <b>1. Ức chế dập tắt:</b> Xuất hiện khi kích thích có điều kiện (tiếng chuông) lặp lại nhiều lần mà <i>không được củng cố</i> bằng kích thích không điều kiện (thức ăn). Đường liên hệ tạm thời bị ức chế, phản xạ mất dần. (Vd: Dập tắt thói quen xấu khi không còn được tưởng thưởng).", "• <b>2. Ức chế phân biệt:</b> Chỉ củng cố kích thích chuẩn (chuông tần số 1000Hz), không củng cố kích thích na ná (chuông 800Hz). Giúp nơ-ron phân biệt tinh tế các tín hiệu khác nhau trong môi trường. (Vd: Trẻ học phân biệt chữ 'o' và chữ 'ô').", "• <b>3. Ức chế làm chậm:</b> Kéo dài dần khoảng thời gian giữa lúc bật tín hiệu có điều kiện đến khi cho ăn (từ vài giây kéo dài ra 2-3 phút). Phản ứng tiết nước bọt không xuất hiện ngay mà hoãn lại đúng thời điểm thức ăn tới. Là cơ sở sinh lý của <b>tính kiên nhẫn, khả năng tự chủ và chờ đợi</b>.", "• <b>4. Ức chế điều kiện:</b> Phối hợp thêm một tác nhân phụ biến kích thích có điều kiện thành tín hiệu ngưng hoạt động."]}, {"h": "Định hình Động lực (Dynamic Stereotype) & Ý nghĩa Thích nghi", "items": ["<b>Định hình động lực (Dynamic Stereotype):</b> Là một hệ thống các phản xạ có điều kiện được cố định hóa theo một trình tự thời gian và không gian nhất định trên vỏ não sau nhiều lần lặp lại.", "<b>Ý nghĩa thực tiễn:</b>", "• Giúp cơ thể thực hiện chuỗi hành vi phức tạp một cách tự động, nhịp nhàng, tốn ít năng lượng thần kinh nhất (vd: thói quen dậy sớm, kỹ năng đánh máy 10 ngón, chơi đàn piano, quy trình làm việc chuẩn).", "• <i>Tính linh hoạt:</i> Dù đã định hình bền vững nhưng vẫn là 'động' (dynamic), có thể phá vỡ và tái lập định hình mới khi môi trường sống thay đổi (dù đòi hỏi nỗ lực ức chế và hưng phấn rất lớn)."]}], "tables": [{"title": "So sánh Phản xạ Không điều kiện vs. Phản xạ Có điều kiện", "head": ["Tiêu chí phân biệt", "Phản xạ Không điều kiện (PX KĐK)", "Phản xạ Có điều kiện (PX CĐK)"], "rows": [["Nguồn gốc hình thành", "Bẩm sinh, di truyền theo loài từ khi sinh ra", "Tập nhiễm, hình thành trong đời sống cá thể qua trải nghiệm"], ["Cung phản xạ giải phẫu", "Cố định, khép kín ở tủy sống và thân não", "Tạm thời, bắt buộc có sự tham gia của Vỏ bán cầu đại não"], ["Tác nhân kích thích", "Tác nhân không điều kiện tác động trực tiếp lên thụ thể", "Tác nhân có điều kiện (bất kỳ) mang ý nghĩa báo hiệu gián tiếp"], ["Số lượng & Tính bền vững", "Số lượng hạn chế, bền vững suốt đời không mất", "Số lượng vô hạn, không bền vững (dễ mất nếu không củng cố)"], ["Ý nghĩa thích nghi", "Thích nghi thô sơ trong điều kiện sống ổn định", "Thích nghi mềm dẻo, linh hoạt với môi trường luôn biến đổi"]]}, {"title": "So sánh Ức chế Không điều kiện vs. Ức chế Có điều kiện", "head": ["Tiêu chí", "Ức chế Không điều kiện (Ngoại sinh)", "Ức chế Có điều kiện (Nội sinh)"], "rows": [["Bản chất sinh học", "Bẩm sinh, có sẵn ở mọi cá thể cùng loài", "Mắc phải, hình thành do rèn luyện và học tập"], ["Nguyên nhân xuất hiện", "Do kích thích lạ (bộc phát) hoặc kích thích quá ngưỡng (vượt hạn)", "Do không củng cố, do phân biệt hoặc hoãn củng cố"], ["Vị trí xảy ra", "Xảy ra ở cả vỏ não và các tầng thần kinh dưới vỏ", "Chỉ xảy ra chuyên biệt ở Vỏ bán cầu đại não"], ["Ý nghĩa thích nghi", "Bảo vệ tế bào nơ-ron khỏi kiệt quệ năng lượng; sinh tồn", "Giúp hành vi tinh vi, chính xác, rèn luyện tính kiên nhẫn, tự chủ"]]}], "tips": ["Muốn tạo thói quen mới: Tín hiệu có điều kiện (chuông) <b>phải đi TRƯỚC</b> phần thưởng/củng cố (thức ăn); đi sau sẽ không bao giờ tạo được phản xạ!", "Khi học tập mệt mỏi mà cố nhồi nhét, não sẽ bật cơ chế <b>Ức chế vượt hạn</b> (bảo vệ) khiến bạn đọc sách mà chữ không vào đầu — giải pháp là ngủ nghỉ để hồi phục.", "<b>Ức chế làm chậm</b> là nền tảng sinh lý của 'Khả năng trì hoãn sự thỏa mãn' (Marshmallow test) — chìa khóa của thành công cá nhân.", "Quen tay, thành thạo một kỹ năng chính là hình thành <b>Định hình động lực (Dynamic stereotype)</b> trên vỏ não."], "cards": [["Hưng phấn (Excitation)", "Quá trình thần kinh kích hoạt hoặc làm tăng cường hoạt động của tế bào và cơ quan."], ["Ức chế (Inhibition)", "Quá trình thần kinh kìm hãm, suy giảm hoặc làm ngừng trệ hoạt động đang diễn ra."], ["Đường liên hệ tạm thời", "Kết nối chức năng mới hình thành giữa 2 ổ hưng phấn trên vỏ não trong phản xạ có điều kiện."], ["Cảm ứng đồng thời", "Quy luật: Một ổ hưng phấn xuất hiện sẽ gây ức chế ở các vùng xung quanh trên vỏ não."], ["Cảm ứng tiếp diễn", "Quy luật: Tại cùng một điểm, sau trạng thái hưng phấn mạnh sẽ tiếp nối trạng thái ức chế sâu sắc."], ["Ức chế bộc phát (Ngoại lai)", "Ức chế bẩm sinh do kích thích lạ gây phản xạ định hướng 'Cái gì thế?', dập tắt phản xạ cũ."], ["Ức chế vượt hạn (Bảo vệ)", "Ức chế xuất hiện khi kích thích quá mạnh hoặc kéo dài, bảo vệ tế bào vỏ não không kiệt quệ."], ["Giấc ngủ tự nhiên", "Hiện tượng ức chế bảo vệ lan tỏa ra toàn bộ vỏ bán cầu đại não và các tầng dưới vỏ."], ["Ức chế dập tắt", "Ức chế nội sinh xuất hiện khi kích thích có điều kiện không còn được củng cố bằng kích thích không điều kiện."], ["Ức chế phân biệt", "Ức chế chỉ củng cố kích thích chuẩn, giúp phân biệt tinh tế các tín hiệu sai lệch."], ["Ức chế làm chậm", "Ức chế kéo dài khoảng hoãn giữa tín hiệu và củng cố; là cơ sở của tính kiên nhẫn và tự chủ."], ["Định hình động lực", "Hệ thống các phản xạ có điều kiện được cố định hóa theo trình tự không gian và thời gian."]], "qs": [["Cơ sở sinh lý học thần kinh cốt lõi của việc hình thành một Phản xạ có điều kiện theo I.P. Pavlov là:", ["Sự phá hủy hoàn toàn bao myelin của nơ-ron cảm giác", "Sự thành lập đường liên hệ thần kinh tạm thời giữa 2 ổ hưng phấn trên vỏ não", "Sự xuất hiện đột ngột của ức chế vượt hạn", "Sự đóng băng toàn bộ các kênh ion Canxi"], 1, "Bản chất của phản xạ có điều kiện là sự hình thành đường liên hệ thần kinh tạm thời trên vỏ não."], ["Điều kiện tiên quyết nào sau đây là bắt buộc để thành lập một phản xạ có điều kiện?", ["Kích thích có điều kiện phải đi trước kích thích không điều kiện một khoảng thời gian ngắn", "Kích thích không điều kiện phải xuất hiện trước kích thích có điều kiện", "Phải thực hiện trong lúc đối tượng đang ngủ sâu", "Kích thích có điều kiện phải gây đau đớn dữ dội"], 0, "Kích thích có điều kiện (tín hiệu) bắt buộc phải đi trước kích thích không điều kiện."], ["Khi đang chăm chú làm bài thi, một tiếng sấm sét nổ vang khiến sinh viên giật mình đánh rơi bút và ngưng viết. Đây là ví dụ của dạng ức chế nào?", ["Ức chế vượt hạn", "Ức chế dập tắt", "Ức chế bộc phát (ngoại lai)", "Ức chế phân biệt"], 2, "Tiếng sấm kích thích phản xạ định hướng bất ngờ, gây ức chế bộc phát dập tắt hành vi viết."], ["Một học sinh học bài liên tục suốt 14 tiếng đồng hồ không nghỉ, sau đó rơi vào trạng thái đờ đẫn, đọc sách không hiểu gì và thiếp đi. Hiện tượng này do dạng ức chế nào bảo vệ não bộ?", ["Ức chế dập tắt", "Ức chế vượt hạn (bảo vệ)", "Ức chế phân biệt", "Ức chế làm chậm"], 1, "Ức chế vượt hạn xuất hiện khi kích thích kéo dài quá sức chịu đựng chức năng của nơ-ron."], ["Khi một thói quen (như rung chuông thì chó tiết nước bọt) lặp đi lặp lại nhiều lần mà không bao giờ được cho ăn nữa, phản xạ sẽ yếu dần rồi biến mất. Đây là:", ["Ức chế dập tắt", "Ức chế bộc phát", "Ức chế làm chậm", "Ức chế vượt hạn"], 0, "Ức chế dập tắt xảy ra khi kích thích có điều kiện không còn được củng cố bằng kích thích không điều kiện."], ["Bản chất sinh lý học của khả năng rèn luyện 'tính kiên nhẫn', biết kiềm chế chờ đợi đến thời điểm thích hợp là dạng ức chế nào?", ["Ức chế bộc phát", "Ức chế vượt hạn", "Ức chế làm chậm", "Ức chế dập tắt"], 2, "Ức chế làm chậm tạo ra khoảng hoãn giữa tín hiệu và hành động, rèn luyện khả năng tự chủ."], ["Quy luật nào giải thích hiện tượng: Một người đang tập trung cao độ giải bài toán khó thì hoàn toàn không để ý thấy tiếng quạt trần hay người khác nói chuyện bên cạnh?", ["Quy luật lan tỏa", "Quy luật cảm ứng đồng thời", "Quy luật tương quan cường độ", "Quy luật thích ứng cảm giác"], 1, "Ổ hưng phấn mạnh ở trung khu tư duy gây ức chế cảm ứng đồng thời ở các vùng cảm giác xung quanh."], ["Hệ thống các phản xạ có điều kiện được kết nối tuần tự thành thói quen vững chắc, giúp cơ thể thao tác thuần thục và tiết kiệm năng lượng được Pavlov gọi là:", ["Cung phản xạ tủy sống", "Định hình động lực (Dynamic Stereotype)", "Tính mềm dẻo ngoại biên", "Hội chứng Split-Brain"], 1, "Định hình động lực là hệ thống phản xạ có điều kiện nối tiếp nhau thành nếp quen vững chắc trên vỏ não."]], "trees": [["Hưng phấn – Ức chế & PX CĐK", "Quy luật cơ bản của vỏ não", "gồm", [["2 Quá trình cơ bản", "Hưng phấn & Ức chế", "quy luật", [["Lan tỏa & Tập trung", "từ một điểm lan rộng rồi thu gọn lại", "", []], ["Cảm ứng qua lại", "cảm ứng đồng thời (xung quanh) & tiếp diễn (nối tiếp)", "", []], ["Tương quan cường độ", "kích thích mạnh tạo đáp ứng mạnh trong ngưỡng", "", []]]], ["Phản xạ Có điều kiện", "Thí nghiệm Pavlov", "nguyên lý", [["Điều kiện thành lập", "CS đi trước US ngắn; vỏ não tỉnh táo; không kích thích lạ", "", []], ["Cơ chế cốt lõi", "hình thành Đường liên hệ thần kinh tạm thời trên vỏ não", "", []], ["Ý nghĩa", "thích nghi linh hoạt và dự báo biến động môi trường", "", []]]], ["Ức chế Không ĐK (Ngoại sinh)", "Bẩm sinh, bảo vệ", "gồm", [["Ức chế bộc phát", "kích thích lạ tạo phản xạ định hướng dập tắt phản xạ cũ", "", []], ["Ức chế vượt hạn", "kích thích quá mạnh/dài; bảo vệ nơ-ron kiệt quệ (Giấc ngủ)", "", []]]], ["Ức chế Có ĐK (Nội sinh)", "Tập nhiễm, rèn luyện", "gồm", [["Ức chế dập tắt", "không củng cố làm mất phản xạ (bỏ thói quen cũ)", "", []], ["Ức chế phân biệt", "chỉ củng cố kích thích chuẩn, nhận diện tinh vi", "", []], ["Ức chế làm chậm", "hoãn củng cố; nền tảng tính kiên nhẫn & tự chủ", "", []]]], ["Định hình Động lực", "Thói quen vững chắc", "chuỗi phản xạ liên hoàn tự động trên vỏ não", []]]]]}, {"id": "tk6", "part": "Phần II: HĐTK Cấp cao & Hiện tượng Tâm lý", "code": "TK.6", "title": "Hệ thống Tín hiệu, 4 Kiểu Thần kinh & Học tập – Trí nhớ", "goals": ["Mô tả hoạt động phân tích, tổng hợp của vỏ não và phân biệt 2 Hệ thống tín hiệu (HTTH).", "Trình bày 4 kiểu hoạt động thần kinh theo I.P. Pavlov và mối liên hệ với 4 khí chất Hippocrates.", "Giải thích cơ chế sinh lý của Học tập & Trí nhớ (Hồi hải mã, củng cố synap dài hạn - LTP).", "Vận dụng nguyên tắc sinh lý thần kinh để tối ưu hóa phương pháp học tập và rèn luyện trí nhớ."], "sections": [{"h": "Hoạt động Phân tích – Tổng hợp của Vỏ não", "items": ["<b>Hoạt động Phân tích (Analysis):</b> Quá trình vỏ não phân chia một kích thích phức tạp của môi trường thành từng thuộc tính đơn lẻ (nhờ thụ thể và vùng vỏ não cảm giác sơ cấp). Vd: Mắt phân tích riêng độ sáng, màu sắc đỏ/xanh, góc cạnh của quả táo.", "<b>Hoạt động Tổng hợp (Synthesis):</b> Quá trình các vùng liên hợp vỏ não liên kết các thuộc tính đơn lẻ đã được phân tích thành một hình ảnh tổng thể trọn vẹn, khái quát. Vd: Tổng hợp màu đỏ + mùi thơm + vị ngọt + hình tròn thành nhận thức 'Quả táo ăn được'.", "<b>Mối quan hệ biện chứng:</b> Phân tích và Tổng hợp là hai mặt của một quá trình nhận thức thống nhất; không có phân tích chi tiết thì tổng hợp sai lệch, không có tổng hợp thì nhận thức rời rạc vô nghĩa."]}, {"h": "Hai Hệ thống Tín hiệu (Signaling Systems) của Pavlov", "items": ["<b>Hệ thống tín hiệu thứ nhất (First Signaling System):</b>", "• Tín hiệu là bản thân <b>các sự vật, hiện tượng cụ thể</b> trong thế giới khách quan tác động trực tiếp vào các giác quan (màu sắc, âm thanh sấm sét, mùi vị, nhiệt độ nóng lạnh).", "• <i>Phạm vi:</i> Chung cho cả <b>con người và động vật</b>.", "• Là cơ sở sinh lý của <b>tư duy hình tượng cụ thể</b> và cảm giác, tri giác trực quan.", "<b>Hệ thống tín hiệu thứ hai (Second Signaling System):</b>", "• Tín hiệu là <b>tiếng nói và chữ viết</b> — được Pavlov gọi là <i>'Tín hiệu của các tín hiệu thứ nhất'</i>.", "• <i>Phạm vi:</i> <b>Đặc trưng riêng biệt duy nhất của con người</b>; hình thành gắn liền với lao động và đời sống xã hội.", "• Là cơ sở sinh lý của <b>tư duy trừu tượng, khái quát hóa</b>, ngôn ngữ, ý thức và văn hóa nhân loại."]}, {"h": "Bốn Kiểu Hoạt động Thần kinh theo Pavlov & Bốn Khí chất", "items": ["<b>Ba thuộc tính của hai quá trình Hưng phấn & Ức chế (Pavlov):</b>", "• <i>Cường độ:</i> Thần kinh Mạnh hay Yếu.", "• <i>Cân bằng:</i> Hưng phấn và Ức chế có tương đương nhau hay chênh lệch (Cân bằng vs Không cân bằng).", "• <i>Linh hoạt:</i> Khả năng chuyển đổi qua lại giữa Hưng phấn và Ức chế nhanh hay chậm (Linh hoạt vs Không linh hoạt).", "<b>Bốn kiểu hình thần kinh kinh điển đối chiếu 4 khí chất Hippocrates:</b>", "1. <b>Mạnh – Cân bằng – Linh hoạt:</b> Tương ứng khí chất <b>Hăng hái / Hoạt bát (Sanguine)</b>. Tiếp thu nhanh, năng động, lạc quan, thích nghi tốt với môi trường mới, nhưng dễ nản nếu công việc lặp lại đơn điệu.", "2. <b>Mạnh – Cân bằng – Không linh hoạt (Trầm):</b> Tương ứng khí chất <b>Bình thản / Điềm đạm (Phlegmatic)</b>. Chắc chắn, kiên trì, ngăn nắp, làm việc sâu sắc, kiềm chế cảm xúc rất tốt nhưng khó thay đổi thói quen cũ.", "3. <b>Mạnh – Không cân bằng (Hưng phấn > Ức chế):</b> Tương ứng khí chất <b>Nóng nảy (Choleric)</b>. Nhiệt huyết, quyết liệt, dám nghĩ dám làm, phản ứng cực nhanh nhưng dễ cáu gắt, thiếu kiên nhẫn khi gặp cản trở.", "4. <b>Yếu (Cả hưng phấn và ức chế đều yếu):</b> Tương ứng khí chất <b>Ưu tư (Melancholic)</b>. Tế bào vỏ não dễ bị ức chế vượt hạn khi chịu kích thích mạnh; giàu lòng trắc ẩn, nhạy cảm tinh tế nhưng nhút nhát, dễ tổn thương và chịu áp lực kém."]}, {"h": "Cơ chế Sinh lý Thần kinh của Học tập & Trí nhớ", "items": ["<b>Trí nhớ ngắn hạn vs. Trí nhớ dài hạn:</b>", "• <i>Trí nhớ ngắn hạn (Làm việc):</i> Dựa trên hoạt động tuần hoàn xung điện trong mạng nơ-ron (vỏ não trước trán PFC), kéo dài vài giây đến vài phút.", "• <i>Trí nhớ dài hạn:</i> Đòi hỏi thay đổi cấu trúc synap và tổng hợp protein mới.", "<b>Củng cố synap dài hạn (Long-Term Potentiation - LTP):</b>", "• Cơ chế sinh học phân tử cốt lõi của việc ghi nhớ: Khi một synap được kích hoạt lặp đi lặp lại với tần số cao, kênh thụ thể <b>NMDA</b> mở ra cho dòng $Ca^{2+}$ ồ ạt vào màng sau synap.", "• $Ca^{2+}$ kích hoạt enzyme kinase chèn thêm hàng loạt thụ thể <b>AMPA</b> lên màng sau synap, làm synap đó trở nên <b>siêu nhạy cảm</b> với kích thích trong tương lai.", "<b>Vai trò sống còn của Hồi hải mã (Hippocampus):</b>", "• Là 'nhạc trưởng' củng cố trí nhớ (Memory consolidation); chuyển đổi trí nhớ ngắn hạn thành dài hạn để lưu trữ rải rác trên vỏ não.", "• Bệnh nhân kinh điển <b>H.M. (Henry Molaison)</b> bị cắt bỏ 2 bên hồi hải mã: Giữ nguyên ký ức tuổi thơ cũ nhưng mất hoàn toàn khả năng tạo ký ức sự kiện mới (Chứng quên thuận chiều - Anterograde amnesia)."]}, {"h": "Vận dụng Khoa học Não bộ Tối ưu hóa Phương pháp Học tập", "items": ["<b>1. Ôn tập ngắt quãng (Spaced Repetition):</b> Phân tán thời gian học thành nhiều đợt cách nhau giúp kích thích củng cố LTP và tránh để nơ-ron rơi vào <b>ức chế vượt hạn</b>.", "<b>2. Thực hành truy hồi chủ động (Active Recall):</b> Tự đặt câu hỏi và cố gắng nhớ lại (làm flashcards, giải đề thi) kích hoạt đường liên hệ thần kinh tạm thời mạnh gấp 10 lần so với việc đọc thụ động.", "<b>3. Vai trò của Giấc ngủ đối với Trí nhớ:</b> Trong giấc ngủ sóng chậm (NREM) và ngủ REM, Hồi hải mã liên tục 'phát lại' (replay) các thông tin học trong ngày lên vỏ não để khắc sâu ký ức; thiếu ngủ làm giảm 40% khả năng ghi nhớ thông tin mới.", "<b>4. Đa giác quan hóa thông tin:</b> Kết hợp hình ảnh (Thùy chẩm), âm thanh (Thùy thái dương) và sơ đồ tư duy liên kết cả hai bán cầu não giúp gia tăng độ bền vững của mạng lưới synap."]}], "tables": [{"title": "Ma trận 4 Kiểu Hoạt động Thần kinh Pavlov đối chiếu 4 Khí chất Hippocrates", "head": ["Kiểu Thần kinh (Pavlov)", "Cường độ – Cân bằng – Linh hoạt", "Khí chất tương ứng", "Đặc điểm tâm lý & Ứng xử"], "rows": [["Kiểu Linh hoạt", "Mạnh – Cân bằng – Linh hoạt", "Hăng hái (Sanguine)", "Hoạt bát, cởi mở, tiếp thu nhanh, thích nghi linh hoạt, dễ chán việc đơn điệu"], ["Kiểu Trầm / Bình thản", "Mạnh – Cân bằng – Không linh hoạt", "Điềm đạm (Phlegmatic)", "Điềm tĩnh, kiên định, ngăn nắp, sâu sắc, khó thay đổi nền nếp cũ"], ["Kiểu Nóng nảy", "Mạnh – Không cân bằng (HP > ỨC)", "Nóng nảy (Choleric)", "Nhiệt huyết, xông xáo, bộc trực, phản ứng mạnh, dễ cáu giận mất kiềm chế"], ["Kiểu Yếu", "Yếu (Cả HP và ỨC đều yếu)", "Ưu tư (Melancholic)", "Nhạy cảm, sâu sắc, tinh tế, chịu áp lực kém, nhút nhát, dễ bị ức chế vượt hạn"]]}, {"title": "So sánh Hệ thống Tín hiệu Thứ nhất vs. Hệ thống Tín hiệu Thứ hai", "head": ["Tiêu chí đối sánh", "Hệ thống Tín hiệu Thứ nhất", "Hệ thống Tín hiệu Thứ hai"], "rows": [["Bản chất tín hiệu", "Sự vật, hiện tượng cụ thể, trực quan (ánh sáng, âm thanh, mùi vị thực tế)", "Tiếng nói và chữ viết (ngôn ngữ, khái niệm trừu tượng)"], ["Chủ thể sở hữu", "Chung cho cả loài người và động vật", "Duy nhất chỉ có ở con người"], ["Hình thức tư duy", "Tư duy hình tượng cụ thể, cảm tính", "Tư duy trừu tượng, logic, khái quát bản chất"], ["Cơ chế sinh lý học", "Vỏ não cảm giác sơ cấp tiếp nhận kích thích trực tiếp", "Vùng ngôn ngữ vỏ não (Broca, Wernicke) và vùng liên hợp trước trán"], ["Ví dụ thực tế", "Nhìn thấy quả chanh thật chua hoặc ngửi thấy mùi khói khét", "Nghe người khác nói chữ 'Chanh' hoặc đọc bài thơ về quê hương"]]}], "tips": ["Hệ thống tín hiệu <b>thứ hai</b> (tiếng nói, chữ viết) là ranh giới sinh lý học vĩ đại nhất phân biệt con người với loài vật.", "Không có kiểu thần kinh nào là 'tốt nhất' hay 'xấu nhất' — mỗi kiểu đều có thế mạnh riêng nếu biết bố trí môi trường phù hợp.", "LTP (Củng cố synap dài hạn) cần <b>sự lặp lại ngắt quãng</b> để chèn thêm thụ thể AMPA — học dồn một đêm trước thi chỉ tạo trí nhớ ngắn hạn rất nhanh trôi.", "Hồi hải mã đóng vai trò như 'bộ nhớ đệm tạm thời'; giấc ngủ sâu chính là lúc dữ liệu được ghi vĩnh viễn vào 'ổ cứng' vỏ não."], "cards": [["Hoạt động phân tích", "Quá trình vỏ não phân chia kích thích phức tạp thành các thuộc tính cảm giác đơn lẻ."], ["Hoạt động tổng hợp", "Quá trình vùng liên hợp vỏ não gắn kết các thuộc tính đơn lẻ thành nhận thức trọn vẹn."], ["Hệ thống tín hiệu thứ nhất", "Tín hiệu là bản thân sự vật, hiện tượng cụ thể tác động trực tiếp lên giác quan (người & vật)."], ["Hệ thống tín hiệu thứ hai", "Tín hiệu là tiếng nói và chữ viết, phản ánh thế giới trừu tượng (chỉ có ở người)."], ["Kiểu thần kinh Hăng hái", "Mạnh - Cân bằng - Linh hoạt: hoạt bát, nhanh nhẹn, thích nghi cao."], ["Kiểu thần kinh Điềm đạm", "Mạnh - Cân bằng - Không linh hoạt: điềm tĩnh, ngăn nắp, kiên định, khó đổi thói quen."], ["Kiểu thần kinh Nóng nảy", "Mạnh - Không cân bằng (hưng phấn chiếm ưu thế): nhiệt huyết, quyết liệt, dễ cáu gắt."], ["Kiểu thần kinh Ưu tư", "Yếu (cả hưng phấn và ức chế đều yếu): nhạy cảm, tinh tế, chịu áp lực kém."], ["Củng cố synap dài hạn (LTP)", "Sự gia tăng bền vững hiệu quả dẫn truyền synap sau kích thích lặp lại tần số cao."], ["Hồi hải mã (Hippocampus)", "Cấu trúc hệ viền chịu trách nhiệm đóng gói và chuyển trí nhớ ngắn hạn thành dài hạn."], ["Chứng quên thuận chiều", "Mất khả năng ghi nhớ các sự kiện mới xảy ra sau khi hồi hải mã bị tổn thương (ca H.M.)."], ["Thực hành truy hồi (Active Recall)", "Phương pháp tự kiểm tra và nhớ lại thông tin giúp kích hoạt tái cấu trúc mạng nơ-ron."]], "qs": [["Điểm khác biệt cốt lõi nhất giữa Hệ thống tín hiệu thứ nhất và Hệ thống tín hiệu thứ hai là gì?", ["Hệ thống tín hiệu thứ nhất chỉ có ở động vật", "Hệ thống tín hiệu thứ hai (tiếng nói, chữ viết) chỉ duy nhất có ở con người", "Hệ thống tín hiệu thứ nhất không sử dụng giác quan", "Hệ thống tín hiệu thứ hai không liên quan đế /* ---------- Storage & State ---------- */
const STORE_KEY = "hdtkcc_review_v1";
let S = { q: {}, c: {}, exam: [] };
try {
  const saved = localStorage.getItem(STORE_KEY);
  if(saved) S = JSON.parse(saved);
} catch(e) {}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){}
}

let state = { view: "home", tab: "sum" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function mastery(l) {
  let ok = 0, done = 0;
  l.qs.forEach((q, idx) => {
    const st = S.q[l.id + "-" + idx];
    if(st && st.done) { done++; if(st.ok) ok++; }
  });
  return { ok, done, total: l.qs.length, pct: l.qs.length ? Math.round(ok / l.qs.length * 100) : 0 };
}

function wrongIds() {
  const res = [];
  LESSONS.forEach(l => {
    l.qs.forEach((q, idx) => {
      const qid = l.id + "-" + idx;
      if(S.q[qid] && S.q[qid].done && !S.q[qid].ok) res.push(qid);
    });
  });
  return res;
}

function cardStats(l) {
  let known = 0;
  l.cards.forEach((c, idx) => {
    if(S.c[l.id + "-" + idx] === "known") known++;
  });
  return { known, total: l.cards.length };
}

/* ---------- Navigation ---------- */
function go(v, tab) {
  state.view = v;
  if(tab) state.tab = tab;
  $("#side").classList.remove("open");
  renderSide();
  renderMain();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderSide() {
  const c = $("#sideLessons");
  let curPart = "";
  let html = "";
  LESSONS.forEach(l => {
    if(l.part !== curPart) {
      curPart = l.part;
      html += `<div class="part-label">${esc(curPart)}</div>`;
    }
    const on = state.view === l.id ? "on" : "";
    const m = mastery(l);
    html += `
    <button class="lesson-btn ${on}" data-go="${l.id}" data-tab="sum">
      <span class="code">${l.code}</span>
      <span class="name">${esc(l.title)}</span>
      <span class="mini"><i style="width:${m.pct}%"></i></span>
    </button>`;
  });
  c.innerHTML = html;
  $(".nav-home").classList.toggle("on", state.view === "home");
}

// Global click delegation for all navigation elements (nav-home, brand, lessons, exam, axon map)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-go]");
  if(btn) {
    const g = btn.getAttribute("data-go");
    const t = btn.getAttribute("data-tab") || (g === "home" ? "sum" : state.tab);
    go(g, t);
  }
});

/* ---------- Mindmap SVG Engine ---------- */
const MMC = ["#3B4A8C", "#D98A1F", "#1E8C86", "#C8366E", "#7A5BC7", "#2A7FB8", "#6F8A2E", "#B0683A", "#4F6D7A"];

function treeSVG(root, ci0) {
  const LH = 36, PX = 14, NX = 12;
  const tw = (t, px, b) => t.length * px * (b ? 0.6 : 0.53);
  let leaves = 0, cc = 0;
  const nodes = [];

  (function walk(n, d, parent, ci) {
    if (d === 1 || d === 2) ci = cc++;
    const o = { t: n[0], note: n[1] || "", rel: n[2] || "", d, parent, ci, kids: [] };
    o.w = tw(o.t, PX, 1) + (o.note ? tw(" – " + o.note, NX) : 0) + 28;
    o.rw = o.rel ? tw(o.rel, 12) + 20 : 0;
    nodes.push(o);

    const ch = n[3] || [];
    if (!ch.length) {
      o.y = leaves * LH + LH / 2 + 8;
      leaves++;
    }
    ch.forEach(c => o.kids.push(walk(c, d + 1, o, ci)));
    if (ch.length) o.y = (o.kids[0].y + o.kids[o.kids.length - 1].y) / 2;
    return o;
  })(root, 0, null, 0);

  const maxD = Math.max(...nodes.map(n => n.d));
  const colX = [12];
  for (let d = 0; d < maxD; d++) {
    const at = nodes.filter(n => n.d === d);
    colX[d + 1] = colX[d] + Math.max(...at.map(n => n.w)) + Math.max(56, Math.max(...at.map(n => n.rw)) + 44);
  }

  const W = Math.max(...nodes.map(n => colX[n.d] + n.w)) + 24;
  const H = Math.max(leaves * LH + 24, 70);

  let edges = "", body = "";
  nodes.forEach(n => {
    const x = colX[n.d], col = MMC[(n.ci + ci0) % MMC.length];
    if (n.kids.length) {
      const sx = x + n.w;
      let ex = sx;
      if (n.rel) {
        const px = sx + 8;
        body += `<rect x="${px}" y="${n.y - 11}" width="${n.rw}" height="22" rx="11" fill="var(--surface)" stroke="${n.d === 0 ? "var(--muted)" : col}" stroke-width="1.2"/><text x="${px + n.rw / 2}" y="${n.y + 4.3}" text-anchor="middle" font-size="11.5" font-style="italic" fill="${n.d === 0 ? "var(--muted)" : col}">${esc(n.rel)}</text>`;
        edges += `<path d="M${sx},${n.y} H${px}" stroke="${n.d === 0 ? "var(--muted)" : col}" stroke-width="2"/>`;
        ex = px + n.rw;
      }
      n.kids.forEach(k => {
        const kc = MMC[(k.ci + ci0) % MMC.length];
        const kx = colX[k.d];
        const mx = (ex + kx) / 2;
        edges += `<path d="M${ex},${n.y} C${mx},${n.y} ${mx},${k.y} ${kx},${k.y}" fill="none" stroke="${kc}" stroke-width="2" opacity=".75"/>`;
      });
    }

    const fill = n.d === 0 ? "var(--ink)" : n.d === 1 ? col : "var(--surface)";
    const tcol = n.d === 0 ? "var(--paper)" : n.d === 1 ? "#fff" : "var(--ink)";
    body += `<rect x="${x}" y="${n.y - 14}" width="${n.w}" height="28" rx="${n.d < 2 ? 14 : 8}" fill="${fill}" ${n.d >= 2 ? `stroke="${col}" stroke-width="1.5"` : ""}/>`;
    body += `<text x="${x + 14}" y="${n.y + 5}" font-size="${PX}" fill="${tcol}"><tspan font-weight="700">${esc(n.t)}</tspan>${n.note ? `<tspan font-size="${NX}" ${n.d >= 2 ? `fill="var(--muted)"` : `fill-opacity=".85"`}> – ${esc(n.note)}</tspan>` : ""}</text>`;
  });

  return `<svg viewBox="0 0 ${Math.ceil(W)} ${H}" style="min-width:${Math.round(W * 0.72)}px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ tư duy: ${esc(root[0])}" font-family="inherit">${edges}${body}</svg>`;
}

function renderTrees(l) {
  if (!l.trees || !l.trees.length) return "";
  return l.trees.map((t, i) => `
    <div class="tree">
      <div class="mm-scroll">${treeSVG(t, i * 2)}</div>
    </div>
  `).join("");
}

/* ---------- Lesson View ---------- */
function renderLesson(m, l) {

  ];

  let tabNav = tabs.map(t => `
    <button class="tab ${state.tab === t.id ? "on" : ""}" data-tab="${t.id}">

  `).join("");

  m.innerHTML = `
  <div class="lhead">
    <div class="bigcode">${l.code}</div>

      <h2>${esc(l.title)}</h2>

function renderTabBody(l) {

}

/* Tab: Thẻ ghi nhớ Flashcards */
let fcIdx = 0;
function renderTabFc(tb, l) {
  if(!l.cards || !l.cards.length) {
    tb.innerHTML = `<div class="empty">Chưa có thẻ ghi nhớ.</div>`;
    return;
  }
  if(fcIdx >= l.cards.length) fcIdx = 0;
  const c = l.cards[fcIdx];
  const cid = l.id + "-" + fcIdx;
  const isKnown = S.c[cid] === "known";

  tb.innerHTML = `
  <div class="toolbar">
    <span class="muted" style="font-size:13.5px">Thẻ <b>${fcIdx + 1}</b> / ${l.cards.length} • Phím tắt: <b>Space</b> (lật), <b>1</b> (quên), <b>2</b> (thuộc), <b>←/→</b> (chuyển)</span>
    <span class="chip-btn">${isKnown ? "✓ Đã thuộc" : "○ Cần ôn"}</span>
  </div>

  <div class="fc-stage">
    <div class="fc" id="fcCard" tabindex="0" role="button" aria-label="Bấm hoặc gõ Space để lật thẻ">
      <div class="fc-inner">
        <div class="fc-face front">
          <div class="fc-tag">Thuật ngữ / Khái niệm</div>
          <div class="fc-text">${esc(c[0])}</div>
          <div class="fc-hint">Bấm để xem định nghĩa & cơ chế</div>
        </div>
        <div class="fc-face back">
          <div class="fc-tag">Bản chất Sinh lý & Giải phẫu</div>
          <div class="fc-text" style="font-size:16px; font-weight:550">${esc(c[1])}</div>
          <div class="fc-hint">Bấm để lật lại mặt trước</div>
        </div>
      </div>
    </div>

    <div class="fc-controls">
      <button class="btn ghost" id="fcPrev">← Thẻ trước</button>
      <button class="btn ${!isKnown ? "primary" : "ghost"}" id="fcAgain">Quên / Cần ôn lại (1)</button>
      <button class="btn ${isKnown ? "primary" : "ghost"}" id="fcKnow">Đã thuộc (2)</button>
      <button class="btn ghost" id="fcNext">Thẻ tiếp →</button>
    </div>
  </div>`;

  const cardEl = $("#fcCard");
  cardEl.onclick = () => cardEl.classList.toggle("flip");

  $("#fcPrev").onclick = () => { if(fcIdx > 0) { fcIdx--; renderTabFc(tb, l); } };
  $("#fcNext").onclick = () => { if(fcIdx < l.cards.length - 1) { fcIdx++; renderTabFc(tb, l); } };
  $("#fcAgain").onclick = () => {
    S.c[cid] = "again";
    save();
    if(fcIdx < l.cards.length - 1) fcIdx++;
    renderTabFc(tb, l);
    renderSide();
  };
  $("#fcKnow").onclick = () => {
    S.c[cid] = "known";
    save();
    if(fcIdx < l.cards.length - 1) fcIdx++;
    renderTabFc(tb, l);
    renderSide();
  };
}

/* Tab: Trắc nghiệm */
function renderTabQ(tb, l) {
  if(!l.qs || !l.qs.length) {
    tb.innerHTML = `<div class="empty">Chưa có câu hỏi trắc nghiệm.</div>`;
    return;
  }
  const m = mastery(l);
  let html = `
  <div class="toolbar">
    <span class="muted" style="font-size:13.5px">Đã làm: <b>${m.done}/${m.total}</b> câu • Đúng: <b>${m.ok}</b> (${m.pct}%)</span>
    <button class="btn ghost" id="resetQBtn" style="font-size:12.5px; padding:6px 12px">↺ Làm lại bài này</button>
  </div>`;

  html += l.qs.map((q, idx) => {
    const qid = l.id + "-" + idx;
    const st = S.q[qid] || {};
    const answered = st.done;

    const optHtml = q[1].map((opt, oidx) => {
      let cls = "opt";
      if(answered) {
        if(oidx === q[2]) cls += " correct";
        else if(oidx === st.chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qid="${qid}" data-oidx="${oidx}" ${answered ? "disabled" : ""}>
        <span style="opacity:.6">${String.fromCharCode(65 + oidx)}.</span>
        <span>${esc(opt)}</span>
      </button>`;
    }).join("");

    const expHtml = answered ? `
      <div class="exp">
        <b>${st.ok ? "✓ Chính xác!" : "✗ Chưa chính xác!"}</b> ${esc(q[3])}
      </div>` : "";

    return `
    <div class="qcard ${answered ? "answered" : ""}">
      <div class="qtxt"><span class="qnum">Câu ${idx + 1}.</span>${esc(q[0])}</div>
      <div class="opts">${optHtml}</div>
      ${expHtml}
    </div>`;
  }).join("");

  tb.innerHTML = html;

  tb.querySelectorAll(".opt:not(:disabled)").forEach(b => {
    b.onclick = () => {
      const qid = b.getAttribute("data-qid");
      const chosen = parseInt(b.getAttribute("data-oidx"), 10);
      const qidx = parseInt(qid.split("-")[1], 10);
      const q = l.qs[qidx];
      const ok = chosen === q[2];
      S.q[qid] = { done: true, ok, chosen };
      save();
      renderTabQ(tb, l);
      renderSide();
    };
  });

  $("#resetQBtn").onclick = () => {
    if(confirm("Bạn muốn xóa kết quả trắc nghiệm của bài này để luyện lại từ đầu?")) {
      l.qs.forEach((_, idx) => { delete S.q[l.id + "-" + idx]; });
      save();
      renderTabQ(tb, l);
      renderSide();
    }
  };
}

/* ---------- Exam Simulation View ---------- */
function renderExam(m) {
  let allQ = [];

    l.qs.forEach((q, idx) => {
      allQ.push({ q, lid: l.id, idx, code: l.code });
    });
  });

  if(!S.exam || !S.exam.length) {
    allQ.sort(() => Math.random() - 0.5);
    S.exam = allQ.slice(0, 30);
  }

  let doneCount = 0, okCount = 0;
  S.exam.forEach(item => {
    const qid = item.lid + "-" + item.idx;
    const st = S.q[qid];
    if(st && st.done) { doneCount++; if(st.ok) okCount++; }
  });

  let html = `
  <div style="margin-bottom:20px">
    <button class="btn ghost" data-go="home">← Trở về tổng quan</button>
  </div>
  <div class="hero-card" style="margin-bottom:24px">
    <h2>Phòng Thi thử Trắc nghiệm HĐTK Cấp cao</h2>
    <p>Đề thi mô phỏng gồm <b>30 câu hỏi ngẫu nhiên</b> từ toàn bộ 6 bài học. Phản hồi kết quả và giải thích chi tiết ngay khi chọn đáp án.</p>
    <div style="margin-top:14px; font-weight:700">Đã hoàn thành: ${doneCount}/30 câu • Điểm số: ${doneCount ? Math.round(okCount / doneCount * 100) : 0}% (${okCount}/${doneCount})</div>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="newExamBtn">🔄 Tạo đề thi mới ngẫu nhiên</button>
  </div>`;

  html += S.exam.map((item, exIdx) => {
    const q = item.q;
    const qid = item.lid + "-" + item.idx;
    const st = S.q[qid] || {};
    const answered = st.done;

    const optHtml = q[1].map((opt, oidx) => {
      let cls = "opt";
      if(answered) {
        if(oidx === q[2]) cls += " correct";
        else if(oidx === st.chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qid="${qid}" data-oidx="${oidx}" ${answered ? "disabled" : ""}>
        <span style="opacity:.6">${String.fromCharCode(65 + oidx)}.</span>
        <span>${esc(opt)}</span>
      </button>`;
    }).join("");

    const expHtml = answered ? `
      <div class="exp">
        <b>${st.ok ? "✓ Chính xác!" : "✗ Chưa chính xác!"}</b> ${esc(q[3])}
        <div style="margin-top:4px; font-size:12px; color:var(--muted)">Thuộc: <b>${item.code} – ${esc(BYID[item.lid].title)}</b></div>
      </div>` : "";

    return `
    <div class="qcard ${answered ? "answered" : ""}">
      <div class="qtxt"><span class="qnum">Câu ${exIdx + 1} (${item.code}).</span>${esc(q[0])}</div>
      <div class="opts">${optHtml}</div>
      ${expHtml}
    </div>`;
  }).join("");

  m.innerHTML = html;
  bindNavClicks(m);

  m.querySelectorAll(".opt:not(:disabled)").forEach(b => {
    b.onclick = () => {
      const qid = b.getAttribute("data-qid");
      const chosen = parseInt(b.getAttribute("data-oidx"), 10);
      const [lid, qidxStr] = qid.split("-");
      const qidx = parseInt(qidxStr, 10);
      const q = BYID[lid].qs[qidx];
      const ok = chosen === q[2];
      S.q[qid] = { done: true, ok, chosen };
      save();
      renderExam(m);
      renderSide();
    };
  });

  $("#newExamBtn").onclick = () => {
    if(confirm("Tạo đề thi mới ngẫu nhiên 30 câu khác?")) {

      renderExam(m);
    }
  };
}

/* ---------- Main Render Entrypoint ---------- */

/* ---------- Search Modal ---------- */
const searchBtn = $("#searchBtn");
const searchBtnTop = $("#searchBtnTop");
if(searchBtn) searchBtn.onclick = openSearch;
if(searchBtnTop) searchBtnTop.onclick = openSearch;

function openSearch() {
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = `
  <div class="modal">
    <div class="modal-head">
      <input type="text" class="modal-input" id="modalInput" placeholder="Nhập thuật ngữ cần tìm (vd: Pavlov, Amygdala, Synapse, LTP, Giao cảm...)..." autofocus>
      <button class="btn ghost" id="closeSearch">✕</button>
    </div>
    <div class="modal-results" id="modalRes">
      <div class="empty">Gõ ít nhất 2 ký tự để tìm kiếm thuật ngữ trong toàn bộ 6 bài học.</div>
    </div>
  </div>`;
  document.body.appendChild(mask);

  const input = $("#modalInput");
  const res = $("#modalRes");
  $("#closeSearch").onclick = () => mask.remove();
  mask.onclick = e => { if(e.target === mask) mask.remove(); };

  const run = () => {
    const q = input.value.trim().toLowerCase();
    if(q.length < 2) {
      res.innerHTML = `<div class="empty">Gõ ít nhất 2 ký tự để tìm kiếm...</div>`;
      return;
    }

    const matches = [];
    LESSONS.forEach(l => {
      l.sections.forEach(s => {
        s.items.forEach(it => {
          if(it.toLowerCase().includes(q) || s.h.toLowerCase().includes(q)) {
            matches.push({ type: "Lý thuyết", title: s.h, desc: it.replace(/<[^>]+>/g, ''), lid: l.id });
          }
        });
      });
      l.cards.forEach(c => {
        if(c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q)) {
          matches.push({ type: "Thẻ nhớ", title: c[0], desc: c[1], lid: l.id });
        }
      });
      l.qs.forEach(question => {
        if(question[0].toLowerCase().includes(q) || question[3].toLowerCase().includes(q)) {
          matches.push({ type: "Câu trắc nghiệm", title: question[0], desc: "Giải thích: " + question[3], lid: l.id });
        }
      });
    });

    if(!matches.length) {
      res.innerHTML = `<div class="empty">Không tìm thấy nội dung nào chứa từ khóa "${esc(q)}".</div>`;
      return;
    }

    res.innerHTML = matches.slice(0, 30).map(m => `
      <div class="item" data-go="${m.lid}" data-tab="sum">
        <div style="display:flex; justify-content:space-between; margin-bottom:4px">
          <span class="w">${esc(m.title)}</span>
          <span class="chip-btn" style="padding:2px 8px; font-size:11px">${m.type}</span>
        </div>
        <div style="font-size:13.5px; line-height:1.45; color:var(--ink)">${esc(m.desc)}</div>
        <div class="from">Thuộc bài: <b>${BYID[m.lid].code} – ${esc(BYID[m.lid].title)}</b></div>
      </div>
    `).join("");

    res.querySelectorAll("[data-go]").forEach(item => {
      item.onclick = () => {
        const lid = item.getAttribute("data-go");
        mask.remove();
        go(lid, "sum");
      };
    });
  };

  input.oninput = run;
  run();
}

/* ---------- Theme toggle & Mobile menu ---------- */
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hdtkcc_theme", next); } catch(e){}
};
try {
  const savedTheme = localStorage.getItem("hdtkcc_theme");
  if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
} catch(e){}

// Keyboard shortcuts for flashcard
window.addEventListener("keydown", (e) => {
  if(state.tab === "fc") {
    if(e.code === "Space") {
      const f = $("#fcCard");
      if(f) { e.preventDefault(); f.classList.toggle("flip"); }
    } else if(e.key === "1") {
      const b = $("#fcAgain"); if(b) b.click();
    } else if(e.key === "2") {
      const b = $("#fcKnow"); if(b) b.click();
    } else if(e.code === "ArrowRight") {
      const b = $("#fcNext"); if(b) b.click();
    } else if(e.code === "ArrowLeft") {
      const b = $("#fcPrev"); if(b) b.click();
    }
  }
});

// Initial boot
go("home");
</script>

<!-- ================= STUDY TIME TRACKER & HUB NAVIGATION ================= -->
<script>
(function() {
  const COURSE_ID = 'hdtkcc';
  const TIME_KEY = 'study_time_' + COURSE_ID;
  const LAST_KEY = 'last_accessed_' + COURSE_ID;
  
  let lastActive = Date.now();
  let accumulatedSeconds = parseInt(localStorage.getItem(TIME_KEY) || '0', 10);
  
  // Set last accessed time
  localStorage.setItem(LAST_KEY, Date.now().toString());

  // Listen to user activity
  const markActive = () => { lastActive = Date.now(); };
  ['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt => {
    window.addEventListener(evt, markActive, { passive: true });
  });

  // Ticking interval every 1 second
  setInterval(() => {
    const isVisible = document.visibilityState === 'visible';
    const isRecentlyActive = (Date.now() - lastActive) < 180000; // 3 minutes timeout
    
    if (isVisible && isRecentlyActive) {
      accumulatedSeconds += 1;
      if (accumulatedSeconds % 5 === 0) {
        localStorage.setItem(TIME_KEY, accumulatedSeconds.toString());
        localStorage.setItem(LAST_KEY, Date.now().toString());
      }
    }
  }, 1000);

  window.addEventListener('beforeunload', () => {
    localStorage.setItem(TIME_KEY, accumulatedSeconds.toString());
    localStorage.setItem(LAST_KEY, Date.now().toString());
  });

  // Handle URL mode parameter (e.g., ?mode=exam)
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    if (mode === 'exam') {
      setTimeout(() => {
        const btn = document.querySelector('[data-go="exam"]');
        if (btn) btn.click();
      }, 350);
    }
  });
})();
</script>
